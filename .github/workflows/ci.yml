name: CI

on:
  push:
    branches:
      - iroha1-main
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - iroha1-main
      - master
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r dev-requirements.txt
      - name: Run tests
        run: python -m pytest iroha/tests -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Iroha node
        working-directory: docker
        env:
          SUBNET: ci
          IROHA_VERSION: '1.6.0'
        run: docker compose up -d
      - name: Wait for Torii endpoint
        run: |
          timeout 180 bash -c 'until (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null; do sleep 2; done'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r dev-requirements.txt
      - name: Run tests
        run: |
          export IROHA_HOST_ADDR=127.0.0.1:50051
          export IROHA_ADMIN_PRIVATE_KEY="$(cat docker/iroha/keys/admin@test.priv)"
          python -m pytest iroha/tests -v
      - name: Stop Iroha node
        if: always()
        working-directory: docker
        env:
          SUBNET: ci
          IROHA_VERSION: '1.6.0'
        run: docker compose down -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
