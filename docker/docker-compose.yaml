version: '3.5'

networks:
  iroha:
    name: ${SUBNET:-iroha-local}
    attachable: true

services:
  iroha:
    image: hyperledger/iroha:${IROHA_VERSION:-1.6.0}
    container_name: iroha-${SUBNET:-local}
    depends_on:
      - some-postgres
    restart: always
    tty: true
    environment:
      - KEY=keys/node0
      - IROHA_POSTGRES_HOST=some-postgres
      - IROHA_POSTGRES_PORT=5432
      - IROHA_POSTGRES_USER=postgres
      - IROHA_POSTGRES_PASSWORD=mysecretpassword
    entrypoint:
      - /opt/iroha_data/entrypoint.sh
    networks:
      - iroha
    volumes:
      - ./iroha:/opt/iroha_data
    ports:
      - "50051:50051"
    # logging:
    #   driver: none

  some-postgres:
    image: postgres:9.5
    container_name: iroha-postgres-${SUBNET:-local}
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_USER=postgres
    networks:
      - iroha
    logging:
      driver: none
